spring:
  application:
    name: Descarte-Eletronico
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:descarte_eletronico}}
    username: ${DB_USERNAME:descarte}
    password: ${DB_PASSWORD:descarte}
    driver-class-name: org.postgresql.Driver
    connection-init-sql: "SET client_encoding TO 'UTF8';"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health

app:
  admin:
    default-email: ${ADMIN_DEFAULT_EMAIL:admin@descarte.local}
    default-password: ${ADMIN_DEFAULT_PASSWORD:Admin@123}
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
      expiration: ${JWT_EXPIRATION:1h}

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web: DEBUG
    org.apache.tomcat.util.net: DEBUG
