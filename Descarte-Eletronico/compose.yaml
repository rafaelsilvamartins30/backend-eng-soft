services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-descarte-eletronico-postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-descarte_eletronico}
      POSTGRES_USER: ${POSTGRES_USER:-descarte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-descarte}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: descarte-eletronico-backend
    ports:
      - "8080:8080"
    environment:
      # Sobrescreve as variáveis definidas no seu application.yaml
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-descarte_eletronico}
      - DB_USERNAME=${POSTGRES_USER:-descarte}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-descarte}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: